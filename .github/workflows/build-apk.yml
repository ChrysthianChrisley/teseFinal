name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'apk/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: Install Dependencies
        run: |
          npm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          node build.js
          chmod +x android/gradlew
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Commit APK directly to Repository
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/MonitorPlantar-v2.1.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apk/MonitorPlantar-v2.1.apk
          git commit -m "Salvar APK v2.1 diretamente no repositorio [skip ci]" || echo "APK inalterado"
          git push origin HEAD:main

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v2.1-apk apk/MonitorPlantar-v2.1.apk --title "Monitor Plantar v2.1 (APK)" --notes "Download direto do aplicativo Android (.apk) compilado para monitoramento continuo em segundo plano." || gh release upload v2.1-apk apk/MonitorPlantar-v2.1.apk --clobber || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonitorPlantar-v2.1-debug
          path: apk/MonitorPlantar-v2.1.apk

